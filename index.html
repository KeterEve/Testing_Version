<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎉 Petopia Lucky Draw - Dynamic Edition 🎁</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(to right, #a8edea, #fed6e3);
      font-family: 'Luckiest Guy', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: auto;
      padding: 20px;
    }
    h1 {
      color: #fff;
      text-shadow: 2px 2px 8px #000;
      font-size: 2rem;
      text-align: center;
      margin: 1rem;
    }
    #wheel-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      min-width: 250px;
      margin: 20px 0;
    }
    #wheel {
      width: 100%;
      height: auto;
      border-radius: 50%;
      border: 10px solid #fff;
      box-shadow: 0 0 30px #ffb6b9;
      display: block;
    }
    .pointer {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 30px solid #fff;
      position: absolute;
      top: 10px;
      left: calc(50% - 20px);
      z-index: 10;
    }
    /* 控制面板樣式 */
    .control-panel {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    label {
      color: #fff;
      text-shadow: 1px 1px 3px #000;
      font-size: 1.1rem;
    }
    select, button, input {
      font-size: 1.1rem;
      padding: 8px 15px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      outline: none;
    }
    select {
      min-width: 200px;
      border: 2px solid #fff;
    }
    input[type="number"] {
      width: 80px;
      text-align: center;
      border: 2px solid #ffb6b9;
    }
    button {
      background: #ffb6b9;
      box-shadow: 0 4px 0 #eb8f92;
      cursor: pointer;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #eb8f92;
    }
    button:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    #result {
      font-size: 1.3rem;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 5px #000;
      margin-top: 10px;
      max-width: 90%;
      word-wrap: break-word;
      min-height: 1.5em;
    }
    
    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      #wheel-container { max-width: 80vw; }
      .control-panel { width: 100%; }
    }
  </style>
</head>
<body>

  <h1>🎉 PETOPIA LUCKY DRAW 2026 🎁</h1>

  <div class="control-panel">
    <div class="control-row">
      <label for="giftSelector">🎁 選擇獎品 Round：</label>
      <select id="giftSelector">
        <option value="" disabled selected>⏳ 讀取資料中...</option>
      </select>
    </div>
    
    <div class="control-row">
      <label for="currentLimit">🏆 本輪中獎名額：</label>
      <input type="number" id="currentLimit" value="1" min="1">
    </div>
  </div>

  <div id="wheel-container">
    <canvas id="wheel"></canvas>
    <div class="pointer"></div>
  </div>

  <div class="control-row">
    <button id="spin">SPIN!</button>
    <button id="show-winners">查看所有中獎者</button>
    <button id="reset">重置所有紀錄</button>
  </div>

  <div id="result">準備開始...</div>

  <script>
    const canvas = document.getElementById("wheel");
    let ctx = null;
    const spinBtn = document.getElementById("spin");
    const showWinnersBtn = document.getElementById("show-winners");
    const resetBtn = document.getElementById("reset");
    const resultEl = document.getElementById("result");
    const giftSelector = document.getElementById("giftSelector");
    const currentLimitInput = document.getElementById("currentLimit");

    // 資料儲存
    let cachedData = [];          // 從 Google Sheet 抓回來的原始資料
    let drawParticipants = [];    // 當前輪次的參與者 (畫圖用)
    let spinPool = [];            // 當前輪次的抽獎池 (含倍數)
    
    // 狀態管理
    let winners = {};             // 紀錄每個獎品的中獎者名單 { "GiftA": ["User1"], "GiftB": [] }
    let winnerLimits = {};        // 紀錄每個獎品的設定人數 { "GiftA": 2, "GiftB": 5 }
    let uniqueGiftsList = [];     // 所有獎品名稱列表

    // 1. 初始化 Canvas
    function init() {
      ctx = canvas.getContext("2d");
      if (!ctx) {
        resultEl.innerHTML = "❌ 瀏覽器不支援 Canvas";
        return false;
      }
      return true;
    }

    function setCanvasSize() {
      const container = document.getElementById("wheel-container");
      const size = Math.min(container.offsetWidth || 300, 400);
      canvas.width = size;
      canvas.height = size;
      drawWheel();
    }

    // 2. 從 Google Sheet 抓取資料
    async function fetchNames() {
      resultEl.innerHTML = "⏳ 載入資料中...";
      spinBtn.disabled = true;
      
      try {
        const webAppUrl = "https://script.google.com/macros/s/AKfycbw6JtHllSRqbV1coheU9mXdk7LELEczzxTIjJeH1sNa6fhwxRq86Mc6GOMsTsja1ttiSQ/exec";
        const response = await fetch(webAppUrl);
        if (!response.ok) throw new Error("Network error");
        const data = await response.json();

        // 整理資料
        cachedData = data.map(item => ({
          name: item.name,
          Selectedgifts: item.Selectedgifts, // 確保 Google Sheet 欄位名稱對應
          multiple: parseInt(item.multiple || 1)
        }));

        // 動態找出所有獎品名稱 (去重複)
        const allGifts = cachedData.map(item => item.Selectedgifts).filter(g => g);
        uniqueGiftsList = [...new Set(allGifts)];

        updateGiftSelector();
        prepareCurrentRound();
        
      } catch (e) {
        console.error(e);
        resultEl.innerHTML = "❌ 資料載入失敗，請檢查網路";
      }
    }

    // 3. 更新下拉選單 (動態生成)
    function updateGiftSelector() {
      // 記住當前選中的值 (如果有的話)，避免刷新後跑掉
      const currentSelection = giftSelector.value;

      giftSelector.innerHTML = ""; // 清空選單

      if (uniqueGiftsList.length === 0) {
        const option = document.createElement("option");
        option.text = "⚠️ 無資料";
        giftSelector.add(option);
        return;
      }

      uniqueGiftsList.forEach(giftName => {
        // 初始化這個獎品的狀態 (如果尚未存在)
        if (!winners[giftName]) winners[giftName] = [];
        if (!winnerLimits[giftName]) winnerLimits[giftName] = 2; // 預設每個獎品抽 2 人，可自行修改預設值

        const option = document.createElement("option");
        option.value = giftName;
        option.text = `🎁 ${giftName}`;
        giftSelector.add(option);
      });

      // 嘗試恢復之前的選擇，否則選第一個
      if (currentSelection && uniqueGiftsList.includes(currentSelection)) {
        giftSelector.value = currentSelection;
      } else {
        giftSelector.value = uniqueGiftsList[0];
      }
      
      // 更新輸入框顯示的數字
      updateLimitInputDisplay();
    }

    // 當下拉選單改變時，更新輸入框數字
    function updateLimitInputDisplay() {
      const selectedGift = giftSelector.value;
      if (selectedGift && winnerLimits[selectedGift]) {
        currentLimitInput.value = winnerLimits[selectedGift];
      }
    }

    // 當輸入框數字改變時，保存到該獎品的設定中
    currentLimitInput.onchange = () => {
      const selectedGift = giftSelector.value;
      const val = parseInt(currentLimitInput.value);
      if (selectedGift && val > 0) {
        winnerLimits[selectedGift] = val;
        prepareCurrentRound(); // 重新檢查狀態 (例如是否顯示已額滿)
      }
    };

    giftSelector.onchange = () => {
      updateLimitInputDisplay();
      prepareCurrentRound();
    };

    // 4. 準備當前輪次的數據
    function prepareCurrentRound() {
      const selectedGift = giftSelector.value;
      if (!selectedGift) return;

      const currentLimit = winnerLimits[selectedGift];
      const currentWinners = winners[selectedGift];

      // 檢查是否已抽完
      if (currentWinners.length >= currentLimit) {
        drawParticipants = [];
        spinPool = [];
        drawWheel(); // 畫空轉盤或訊息
        resultEl.innerHTML = `✅ <b>${selectedGift}</b> 抽獎完成！<br>(已抽出 ${currentWinners.length}/${currentLimit} 位)`;
        spinBtn.disabled = true;
        return;
      }

      // 過濾出：參加這個獎品 & 還沒中過這個獎 的人
      const filtered = cachedData.filter(p => 
        p.Selectedgifts === selectedGift && !currentWinners.includes(p.name)
      );

      drawParticipants = filtered.map(p => ({ name: p.name, multiple: p.multiple }));
      
      // 建立抽獎池 (根據倍數塞入名單)
      spinPool = [];
      filtered.forEach(p => {
        for(let i=0; i<p.multiple; i++) spinPool.push(p.name);
      });

      drawWheel();
      
      if (drawParticipants.length === 0) {
        resultEl.innerHTML = "⚠️ 此獎項無可用的參與者";
        spinBtn.disabled = true;
      } else {
        resultEl.innerHTML = `準備就緒：<b>${selectedGift}</b><br>進度：${currentWinners.length} / ${currentLimit}`;
        spinBtn.disabled = false;
      }
    }

    // 5. 繪製轉盤 (Canvas)
    function drawWheel() {
      if (!ctx) return;
      const size = canvas.width;
      ctx.clearRect(0, 0, size, size);

      if (drawParticipants.length === 0) {
        ctx.fillStyle = "#666";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("無參與者 / 已結束", size / 2, size / 2);
        return;
      }

      const totalWeight = drawParticipants.reduce((sum, p) => sum + p.multiple, 0);
      const anglePerWeight = (2 * Math.PI) / totalWeight;
      const colors = ["#ff9ff3", "#feca57", "#ff6b6b", "#48dbfb", "#1dd1a1", "#54a0ff", "#5f27cd"];

      let currentAngle = 0;
      drawParticipants.forEach((p, i) => {
        const sliceAngle = p.multiple * anglePerWeight;
        
        ctx.beginPath();
        ctx.moveTo(size / 2, size / 2);
        ctx.arc(size / 2, size / 2, size / 2, currentAngle, currentAngle + sliceAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.stroke();

        // 簡化的文字繪製 (可選)
        ctx.save();
        ctx.translate(size/2, size/2);
        ctx.rotate(currentAngle + sliceAngle/2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(p.name, size/2 - 20, 5);
        ctx.restore();

        currentAngle += sliceAngle;
      });
    }

    // 6. 旋轉邏輯
    function spinWheel() {
      if (spinPool.length === 0) return;

      const selectedGift = giftSelector.value;
      const winnerName = spinPool[Math.floor(Math.random() * spinPool.length)];
      
      // 計算角度以停在該名字上
      const pIndex = drawParticipants.findIndex(p => p.name === winnerName);
      const totalWeight = drawParticipants.reduce((sum, p) => sum + p.multiple, 0);
      const anglePerWeight = (2 * Math.PI) / totalWeight;
      
      let preAngle = 0;
      for(let i=0; i<pIndex; i++) preAngle += drawParticipants[i].multiple * anglePerWeight;
      
      // 目標中心角度
      const targetCenter = preAngle + (drawParticipants[pIndex].multiple * anglePerWeight) / 2;
      // Canvas 0度在右邊(3點鐘)，指針在上方(12點鐘/270度/-90度)
      // 需要旋轉的角度 = (360 - 目標角度) - 90度偏移
      const stopAngle = (2 * Math.PI) - targetCenter - (Math.PI / 2); 
      
      // 多轉幾圈 (5圈)
      const finalRotate = stopAngle + (5 * 2 * Math.PI);

      // 動畫
      canvas.style.transition = "transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)";
      canvas.style.transform = `rotate(${finalRotate}rad)`;
      
      spinBtn.disabled = true;
      resetBtn.disabled = true;
      giftSelector.disabled = true;

      setTimeout(() => {
        // 動畫結束
        canvas.style.transition = "none";
        canvas.style.transform = `rotate(${stopAngle}rad)`; // 重置到實際角度避免數值過大
        
        // 紀錄中獎
        winners[selectedGift].push(winnerName);
        resultEl.innerHTML = `🎉 恭喜 <b>${winnerName}</b> 中獎！<br>(獎品: ${selectedGift})`;
        
        // 3秒後刷新介面
        setTimeout(() => {
          canvas.style.transform = "rotate(0rad)";
          prepareCurrentRound();
          spinBtn.disabled = false;
          resetBtn.disabled = false;
          giftSelector.disabled = false;
        }, 2000);
        
      }, 3000);
    }

    spinBtn.onclick = spinWheel;

    resetBtn.onclick = () => {
      if(confirm("確定要重置所有中獎紀錄嗎？")) {
        winners = {}; // 清空名單
        // 保留 limits 設定
        uniqueGiftsList.forEach(g => winners[g] = []);
        prepareCurrentRound();
        resultEl.innerHTML = "紀錄已重置";
      }
    };

    showWinnersBtn.onclick = () => {
      let html = "<h3>📊 目前中獎名單</h3><div style='text-align:left; display:inline-block;'>";
      for (const [gift, list] of Object.entries(winners)) {
        if (list.length > 0) {
          html += `<b>${gift}</b>: ${list.join(", ")}<br>`;
        }
      }
      html += "</div>";
      resultEl.innerHTML = html || "暫無中獎者";
    };

    window.addEventListener("resize", setCanvasSize);
    window.addEventListener("DOMContentLoaded", () => {
      if (init()) {
        setCanvasSize();
        fetchNames();
      }
    });

  </script>
</body>
</html>
