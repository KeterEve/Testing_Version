<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎉 Petopia Pro Event Draw 🎁</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      font-family: 'Luckiest Guy', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #fff; text-shadow: 2px 2px 0px #ffb6b9, 4px 4px 0px rgba(0,0,0,0.2);
      font-size: 2.2rem; text-align: center; margin-bottom: 20px;
    }
    .control-panel {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    label { color: #ff6b6b; font-size: 0.9rem; font-family: sans-serif; font-weight: bold; }
    select, input {
      width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;
      font-size: 1rem; outline: none; transition: 0.3s;
    }
    select:focus, input:focus { border-color: #ffb6b9; }
    
    #wheel-container {
      position: relative; width: 300px; height: 300px; margin: 20px auto;
    }
    #wheel {
      width: 100%; height: 100%; border-radius: 50%;
      border: 8px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .pointer {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      border-left: 15px solid transparent; border-right: 15px solid transparent;
      border-top: 30px solid #ff6b6b; z-index: 10;
    }

    button {
      padding: 12px; border: none; border-radius: 50px; font-size: 1.2rem;
      font-family: 'Luckiest Guy', cursive; cursor: pointer; color: white;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2); width: 100%;
    }
    button:active { transform: translateY(2px); box-shadow: none; }
    #spin { background: #ff6b6b; }
    #reset-round { background: #a29bfe; font-size: 0.9rem; margin-top: 10px; }

    #status-msg { text-align: center; color: #fff; margin: 10px 0; min-height: 1.5em; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
    
    .winners-box {
      width: 100%; max-width: 500px; background: rgba(255,255,255,0.9);
      border-radius: 15px; padding: 15px; display: none; margin-top: 20px;
    }
    .winner-row {
      display: flex; justify-content: space-between; border-bottom: 1px solid #ddd;
      padding: 8px 0; font-family: sans-serif;
    }
    .w-prize { color: #ff6b6b; font-weight: bold; }

    /* 隱藏手動輸入框，只在沒有設定檔時顯示 */
    .manual-input { display: none; } 
  </style>
</head>
<body>

  <h1>🎉 PETOPIA LUCKY DRAW 🎁</h1>

  <div class="control-panel">
    <div>
      <label>📂 1. 選擇活動 (Event)：</label>
      <select id="eventSelector">
        <option disabled selected>⏳ 讀取資料中...</option>
      </select>
    </div>

    <div id="preset-area">
      <label>🏆 2. 選擇獎品 (Prize)：</label>
      <select id="prizeSelector">
        <option disabled selected>👆 請先選擇活動</option>
      </select>
    </div>

    <div class="manual-input" id="manual-area">
      <label>⚠️ 無預設獎品，請手動輸入：</label>
      <div style="display:flex; gap:10px;">
        <input type="text" id="manualPrize" placeholder="獎品名稱">
        <input type="number" id="manualCount" value="1" min="1" style="width:80px;">
      </div>
    </div>

    <button id="spin" style="margin-top: 15px;">GO! SPIN!</button>
  </div>

  <div id="status-msg">準備就緒...</div>

  <div id="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
  </div>

  <div class="winners-box" id="winnersBox">
    <h3 style="text-align:center; margin:0 0 10px 0;">🏆 中獎名單</h3>
    <div id="winnersList"></div>
    <button id="reset-round">🔄 重置本場紀錄</button>
  </div>

  <script>
    // ⚠️ 記得改這裡的網址！
    const webAppUrl = "https://script.google.com/macros/s/AKfycbw6JtHllSRqbV1coheU9mXdk7LELEczzxTIjJeH1sNa6fhwxRq86Mc6GOMsTsja1ttiSQ/exec";

    let rawData = {};         // 存放 { participants: [], settings: [] }
    let currentPool = [];     // 該活動未中獎名單
    let sessionHistory = [];  // 該活動中獎紀錄
    let currentSettings = []; // 該活動的獎品設定
    let isSpinning = false;
    
    // DOM
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const eventSelector = document.getElementById("eventSelector");
    const prizeSelector = document.getElementById("prizeSelector");
    const manualArea = document.getElementById("manual-area");
    const manualPrize = document.getElementById("manualPrize");
    const manualCount = document.getElementById("manualCount");
    const statusMsg = document.getElementById("status-msg");
    const winnersBox = document.getElementById("winnersBox");
    const winnersList = document.getElementById("winnersList");
    const spinBtn = document.getElementById("spin");
    const resetBtn = document.getElementById("reset-round");

    function init() {
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      fetchData();
    }

    function resizeCanvas() {
      const size = document.getElementById("wheel-container").offsetWidth;
      canvas.width = size;
      canvas.height = size;
      drawWheel();
    }

    // 1. 下載資料
    async function fetchData() {
      try {
        statusMsg.innerText = "連線 Google Sheet 中...";
        const res = await fetch(webAppUrl + "?t=" + new Date().getTime());
        const json = await res.json();
        
        rawData = json; // 格式: { participants: [...], settings: [...] }

        // 提取所有活動名稱 (從參加者名單找)
        const events = [...new Set(json.participants.map(p => p.event))].sort();
        
        eventSelector.innerHTML = "<option disabled selected>👇 請選擇活動</option>";
        events.forEach(e => {
          const opt = document.createElement("option");
          opt.value = e;
          opt.text = e;
          eventSelector.add(opt);
        });

        statusMsg.innerText = "✅ 載入完成";
        
      } catch (e) {
        console.error(e);
        statusMsg.innerText = "❌ 錯誤: 請檢查網址或權限";
      }
    }

    // 2. 切換活動
    eventSelector.onchange = () => {
      sessionHistory = []; // 清空得獎紀錄
      updateWinnersDisplay();
      
      const eventName = eventSelector.value;

      // 載入該活動的參加者
      resetCurrentPool(eventName);

      // 載入該活動的獎品設定 (從 settings 陣列找)
      currentSettings = rawData.settings.filter(s => s.event === eventName);
      
      updatePrizeDropdown();
    };

    // 更新獎品下拉選單
    function updatePrizeDropdown() {
      prizeSelector.innerHTML = "";
      
      if (currentSettings.length > 0) {
        // 有預設獎品
        manualArea.style.display = "none";
        prizeSelector.style.display = "block";
        
        // 自動加上選項
        currentSettings.forEach((setting, index) => {
           const opt = document.createElement("option");
           // 將資料存在 value 裡方便讀取: "大獎|1"
           opt.value = `${setting.prize}|${setting.count}`;
           opt.text = `${setting.prize} (抽 ${setting.count} 人)`;
           prizeSelector.add(opt);
        });
      } else {
        // 無預設獎品，顯示手動輸入框
        prizeSelector.innerHTML = "<option>⚠️ 無預設設定</option>";
        prizeSelector.style.display = "none";
        manualArea.style.display = "block";
      }
    }

    // 重置名單
    function resetCurrentPool(eventName) {
      const participants = rawData.participants.filter(p => p.event === eventName);
      const winnerNames = new Set(sessionHistory.map(w => w.name));

      currentPool = [];
      participants.forEach(p => {
        if (!winnerNames.has(p.name)) {
           for(let i=0; i < (p.multiple || 1); i++) currentPool.push(p.name);
        }
      });
      currentPool.sort(() => Math.random() - 0.5);

      const uniqueCount = new Set(currentPool).size;
      statusMsg.innerHTML = `活動：<b>${eventName}</b> | 剩餘人數：${uniqueCount} 人`;
      drawWheel();
    }

    // 3. 畫圖
    function drawWheel() {
      const size = canvas.width;
      ctx.clearRect(0, 0, size, size);
      
      const distinctNames = [...new Set(currentPool)];
      const count = distinctNames.length;
      
      if (count === 0) {
        ctx.fillStyle = "#ddd";
        ctx.beginPath(); ctx.arc(size/2, size/2, size/2 - 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#555"; ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("無人 / 已抽完", size/2, size/2);
        return;
      }

      const arc = Math.PI * 2 / count;
      const colors = ["#ff9ff3", "#feca57", "#ff6b6b", "#48dbfb", "#1dd1a1"];

      distinctNames.forEach((name, i) => {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(size/2, size/2);
        ctx.arc(size/2, size/2, size/2 - 10, angle, angle + arc);
        ctx.fill(); ctx.stroke();
        
        ctx.save();
        ctx.translate(size/2, size/2);
        ctx.rotate(angle + arc/2);
        ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif";
        ctx.fillText(name.substring(0, 8), size/2 - 25, 5);
        ctx.restore();
      });
    }

    // 4. SPIN
    spinBtn.onclick = () => {
      if (isSpinning || currentPool.length === 0) return;
      if (!eventSelector.value) { alert("請先選擇活動！"); return; }
      
      // 決定獎品和人數
      let prizeName, countToDraw;
      
      if (currentSettings.length > 0) {
        // 使用預設設定
        const val = prizeSelector.value.split("|");
        prizeName = val[0];
        countToDraw = parseInt(val[1]);
      } else {
        // 使用手動輸入
        prizeName = manualPrize.value || "神秘禮物";
        countToDraw = parseInt(manualCount.value) || 1;
      }
      
      const uniqueLeft = new Set(currentPool).size;
      if (uniqueLeft < countToDraw) {
        alert(`人數不足！剩餘 ${uniqueLeft} 人，設定需抽 ${countToDraw} 人。`);
        return;
      }

      isSpinning = true;
      spinBtn.disabled = true;
      
      // 選出中獎者
      let roundWinners = [];
      let tempPool = [...currentPool];
      for(let k=0; k<countToDraw; k++) {
        const idx = Math.floor(Math.random() * tempPool.length);
        const winner = tempPool[idx];
        roundWinners.push(winner);
        tempPool = tempPool.filter(n => n !== winner);
      }

      // 動畫
      let rotation = 0;
      let speed = 30;
      const animate = () => {
        rotation += speed;
        speed -= 0.15;
        canvas.style.transform = `rotate(${rotation}deg)`;
        if (speed > 0) {
          requestAnimationFrame(animate);
        } else {
          finishSpin(roundWinners, prizeName);
        }
      };
      animate();
    };

    function finishSpin(winners, prize) {
      isSpinning = false;
      spinBtn.disabled = false;
      
      winners.forEach(w => sessionHistory.push({ name: w, prize: prize }));
      statusMsg.innerHTML = `🎉 恭喜 <b>${winners.join(", ")}</b> 獲得 ${prize}！`;
      
      updateWinnersDisplay();
      
      // 如果是用下拉選單，自動跳到下一個獎品 (Optional, 但很方便)
      if (currentSettings.length > 0) {
         const currIdx = prizeSelector.selectedIndex;
         if (currIdx < prizeSelector.options.length - 1) {
            prizeSelector.selectedIndex = currIdx + 1;
         }
      }

      setTimeout(() => {
        canvas.style.transition = "none";
        canvas.style.transform = `rotate(0deg)`;
        setTimeout(() => {
             canvas.style.transition = "transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)";
             resetCurrentPool(eventSelector.value); 
        }, 50);
      }, 3000);
    }

    function updateWinnersDisplay() {
      if (sessionHistory.length === 0) {
        winnersBox.style.display = "none"; return;
      }
      winnersBox.style.display = "block";
      let html = "";
      [...sessionHistory].reverse().forEach((item, idx) => {
         const realIdx = sessionHistory.length - idx;
         html += `<div class="winner-row"><span>#${realIdx} <b>${item.name}</b></span><span class="w-prize">${item.prize}</span></div>`;
      });
      winnersList.innerHTML = html;
    }

    resetBtn.onclick = () => {
      if(confirm("確定重置？紀錄將消失。")) {
        sessionHistory = [];
        updateWinnersDisplay();
        resetCurrentPool(eventSelector.value);
      }
    };

    init();
  </script>
</body>
</html>
